def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR){
    ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")){
    ghidraInstallDir= project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir){
    apply from :
        new File (ghidraInstallDir).getCanonicalPath()+
        "/support/buildExtension.gradle"
}

else {
    throw new GradleException("GHIDRA_INSTALL_DIR is not defined")
}

tasks.named('buildExtension') {
    exclude '**/tmp*/**', '**/.dist/**'
    // Keep the Java runner and its Python entry point in the same deployed version.
    from('../../ghidra_scripts/AnalyzeCurrentFunction.py') {
        into "${project.name}/ghidra_scripts"
    }
}

sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('functionListRegression', JavaExec) {
    group = 'verification'
    description = 'Checks delayed function discovery and UI listener lifecycle without a GUI.'
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'ghidraai.FunctionListRefreshRegression'
    systemProperty 'java.awt.headless', 'true'
}

tasks.named('check') {
    dependsOn 'functionListRegression'
}
